<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Front page</title>
 
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
    }

    .container {
        background: linear-gradient(to right, #667eea, skyblue);
      padding: 60px 20px 40px;
      text-align: center;
      color: white;
      height: 630px;
    }

    .section-title {
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .services-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: -20px;
    }

    .service-box {
      background-color: #fff;
      width: 300px;
      margin-top: 70px;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      color: #333;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: block;
    }

    .service-box img{
        height: 50px;
        width: 50px;
       
    }

    .service-box h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    
    .service-box:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .services-container a {
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .service-box {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <section class="container">
    <h2 class="section-title">WEB DEVELOPMENT</h2>
    <p class="name">Sakshi Ganesh Nikam <br> Roll No: 37</p>
    <div class="services-container">
      <a href="HTML/HTMl.html">
        <div class="service-box">
        
          <img src="html_1051277.png" alt="html">
          <h3>ASSIGNMENT</h3>
         
        </div>
      </a>

      <a href="CSS/css.html">
        <div class="service-box">
          <img src="css-3_732190.png" alt="css">
          <h3>CSS</h3>
          
        </div>
      </a>

      <a href="XML/xml.html">
        <div class="service-box">
        <img src="xml_9496555.png" alt="xml">
          <h3>XML</h3>
         
        </div>
      </a>

      

     

    </div>
  </section>

</body>
</html>
